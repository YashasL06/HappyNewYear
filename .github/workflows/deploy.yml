name: Deploy Docker to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::515421558980:role/GitHubActionsRole
        audience: sts.amazonaws.com
        role-session-name: GitHubActionsSession

    - name: Test AWS Auth
      run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      env:
        ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
      run: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
        ECR_REPOSITORY: happy-newyear-app
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Deploy to EC2 via SSM  # FIXED: Proper structure
      env:
        ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
      run: |
        aws ssm start-session --target i-03a340bbd050279ba \
        --document-name AWS-StartSSHSession \
        --parameters '{"portNumber":["22"]}' \
        --region us-east-1 << EOF
          sudo yum install -y docker
          sudo systemctl enable --now docker
          aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY
          sudo docker rm -f newyear-app || true
          sudo docker run -d --name newyear-app -p 80:80 $ECR_REGISTRY/happy-newyear-app:latest
          sudo systemctl stop httpd || true
        EOF
