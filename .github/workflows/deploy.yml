name: Deploy to EC2

on:  # ADD FULL TOP-LEVEL SECTION
  push:
    branches: [ main ]  # Triggers on push to main (change if master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: arn:aws:iam::515421558980:role/GitHubActionsRole
        audience: sts.amazonaws.com
        role-session-name: GitHubActionsSession
    - name: Test AWS (debug)
      run: aws sts get-caller-identity  # Confirms role assume
    - name: Deploy via SSM
      run: |
        aws ssm start-session --target i-YOUR-INSTANCE-ID \
          --document-name AWS-StartSSHSession \
          --parameters '{"portNumber":["22"]}' \
          --region us-east-1 << 'EOF'
        sudo cp -r * /var/www/html/
        sudo systemctl restart httpd
        exit
        EOF
