- name: Login to ECR
  env:
    ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
  run: |
    aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

- name: Build & Push to ECR
  env:
    ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
  run: |
    docker build -t happy-newyear .
    docker tag happy-newyear:latest $ECR_REGISTRY/happy-newyear-app:latest
    docker push $ECR_REGISTRY/happy-newyear-app:latest

- name: Deploy Docker to EC2
  env:
    ECR_REGISTRY: 515421558980.dkr.ecr.us-east-1.amazonaws.com
  run: |
    aws ssm start-session --target i-03a340bbd050279ba \
      --document-name AWS-StartSSHSession \
      --parameters '{"portNumber":["22"]}' \
      --region us-east-1 << 'EOF'
    sudo yum update -y
    sudo yum install -y docker
    sudo systemctl start --now docker
    sudo usermod -aG docker ec2-user
    aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY
    sudo docker run -d --name newyear-app -p 80:80 $ECR_REGISTRY/happy-newyear-app:latest
    sudo docker stop httpd-container || true  # Cleanup old
    sudo systemctl stop httpd  # Stop Apache
    sudo systemctl disable httpd
    exit
    EOF
