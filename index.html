<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Year Envelope</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0, #020617 40%, #000000 100%);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      text-align: center;
    }

    .title {
      font-size: 2.1rem;
      margin-bottom: 18px;
      color: #f9fafb;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
      margin-bottom: 22px;
    }

    .envelope-wrapper {
      display: inline-block;
      perspective: 1000px;
    }

    .envelope {
      position: relative;
      width: 260px;
      height: 180px;
      margin: 0 auto 18px;
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      background: #f97316;
      border-radius: 12px;
      box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(251, 191, 36, 0.4);
      overflow: hidden;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      background: #f97316;
      border-radius: 12px;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: #fb923c;
      clip-path: polygon(0 0, 50% 70%, 100% 0);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.5s ease;
    }

    .envelope-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70%;
      background: #ea580c;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    }

    .card-inner {
      position: absolute;
      inset: 14px 18px;
      background: #0f172a;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f9fafb;
      padding: 10px;
    }

    .card-inner h2 {
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .card-inner p {
      font-size: 0.9rem;
      color: #cbd5f5;
    }

    .open-btn {
      margin-top: 6px;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #052e16;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .open-btn:hover {
      background: #16a34a;
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.6);
      transform: translateY(-1px);
    }

    .open-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
    }

    .hint {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .title {
        font-size: 1.8rem;
      }
      .envelope {
        width: 230px;
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">A Little New Year Mail</h1>
    <p class="subtitle">
      Click the envelope to open your New Year chaos message.
    </p>

    <div class="envelope-wrapper">
      <div class="envelope" id="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-front">
          <div class="envelope-flap" id="envelopeFlap"></div>
          <div class="envelope-bottom"></div>
          <div class="card-inner">
            <h2>Happy New Year 🎉</h2>
            <p>Tap “Open” to view your meme-loaded greeting.</p>
          </div>
        </div>
      </div>
    </div>

    <button class="open-btn" id="openButton">Open</button>

    <p class="hint">
      Hosted from my AWS EC2 lab • powered by HTML, CSS and a lot of hope.
    </p>
  </div>

  <script>
    const flap = document.getElementById('envelopeFlap');
    const openBtn = document.getElementById('openButton');

    function openEnvelopeAndRedirect() {
      // Simple flap animation
      flap.style.transform = 'rotateX(-160deg)';
      setTimeout(() => {
        window.location.href = 'happy-new-year.html';
      }, 450);
    }

    openBtn.addEventListener('click', openEnvelopeAndRedirect);
    // Optional: clicking the envelope also opens it
    document.getElementById('envelope').addEventListener('click', openEnvelopeAndRedirect);
  </script>
</body>
</html>
